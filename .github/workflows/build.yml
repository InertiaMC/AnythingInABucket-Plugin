name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          server-id: github-inertiamc
          server-username: GH_PACKAGES_USER
          server-password: GH_PACKAGES_TOKEN
      - name: Cache Maven downloads
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          # A new pom starts from the last cache, so a version bump downloads only what is new.
          key: maven-${{ github.job }}-${{ hashFiles('pom.xml') }}
          restore-keys: maven-${{ github.job }}-
      - name: Build
        env:
          GH_PACKAGES_USER: ${{ github.actor }}
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: mvn -B clean package
      - name: Upload jar artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: jar
          path: target/AnythingInABucket.jar
          if-no-files-found: error
          retention-days: 14

  # The build job compiles against the oldest supported API. This one compiles against the newest,
  # to catch anything the plugin calls that newer versions removed.
  api-ceiling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          server-id: github-inertiamc
          server-username: GH_PACKAGES_USER
          server-password: GH_PACKAGES_TOKEN
      - name: Cache Maven downloads
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          # A new pom starts from the last cache, so a version bump downloads only what is new.
          key: maven-${{ github.job }}-${{ hashFiles('pom.xml') }}
          restore-keys: maven-${{ github.job }}-
      - name: Compile against the newest API
        env:
          GH_PACKAGES_USER: ${{ github.actor }}
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: mvn -B -q clean test-compile -Dspigot.version=26.3-R0.1-SNAPSHOT
