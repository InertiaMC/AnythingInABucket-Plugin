name: Release

on:
  push:
    tags: [ 'v*.*.*' ]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          server-id: github-inertiamc
          server-username: GH_PACKAGES_USER
          server-password: GH_PACKAGES_TOKEN
      - name: Cache Maven downloads
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          # A new pom starts from the last cache, so a version bump downloads only what is new.
          key: maven-${{ github.job }}-${{ hashFiles('pom.xml') }}
          restore-keys: maven-${{ github.job }}-
      - name: Build
        env:
          GH_PACKAGES_USER: ${{ github.actor }}
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: mvn -B clean package
      # maven-shade's original-<name>.jar has no bundled libraries and fails to load.
      - name: Drop maven-shade's pre-shade artifact
        run: rm -f target/original-*.jar

      - name: Zip the resource pack
        run: cd resourcepack && zip -q -X -r ../target/AnythingInABucket-ResourcePack.zip .

      # Releases go to Modrinth, so the files are kept on the run instead of a GitHub release.
      - name: Keep the jar and the pack
        uses: actions/upload-artifact@v7
        with:
          name: AnythingInABucket-${{ github.ref_name }}
          path: |
            target/AnythingInABucket.jar
            target/AnythingInABucket-ResourcePack.zip
          if-no-files-found: error
